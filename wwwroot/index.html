<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gerenciador de Livros - UI</title>
    <style>
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; margin: 24px; background: #eeeeee; }
      h1 { margin-bottom: 8px; }
      .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
      fieldset { border: 1px solid #ddd; border-radius: 8px; padding: 16px; }
      legend { padding: 0 6px; font-weight: 600; }
      label { display: block; font-size: 14px; margin: 6px 0 2px; }
      input, select, button { padding: 8px; font-size: 14px; }
      button { cursor: pointer; }
      table { width: 100%; border-collapse: collapse; margin-top: 12px; }
      th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
      th { background: #f5f5f5; }
      .actions { display: flex; gap: 8px; }
      .row-edit { background: #fff9e6; }
      .notice { margin-top: 12px; padding: 8px 12px; border-radius: 6px; }
      .notice.ok { background: #e6ffed; border: 1px solid #b7f5c9; }
      .notice.err { background: #ffecec; border: 1px solid #ffb3b3; }
      .toolbar { margin-top: 16px; display: flex; gap: 8px; align-items: center; }
      .small { font-size: 12px; color: #000000; }
      .small code { color: inherit; }
    </style>
  </head>
  <body>
    <h1>Gerenciador de Livros</h1>
    <div class="small">Consome a API em <code>/api/books</code></div>

    <div class="grid">
      <fieldset>
        <legend>Novo Livro</legend>
        <form id="create-form">
          <label for="c-title">Título</label>
          <input id="c-title" name="title" required minlength="2" maxlength="120" />

          <label for="c-author">Autor</label>
          <input id="c-author" name="author" required minlength="2" maxlength="120" />

          <label for="c-genre">Gênero</label>
          <select id="c-genre" name="genre" required></select>

          <label for="c-price">Preço</label>
          <input id="c-price" name="price" type="number" step="0.01" min="0" required />

          <label for="c-stock">Estoque</label>
          <input id="c-stock" name="stock" type="number" min="0" required />

          <div class="toolbar">
            <button type="submit">Criar</button>
            <button type="reset">Limpar</button>
          </div>
        </form>
        <div id="create-notice" class="notice" style="display:none"></div>
      </fieldset>

      <fieldset>
        <legend>Filtros</legend>
        <form id="filter-form">
          <label for="f-title">Título contém</label>
          <input id="f-title" name="title" />

          <label for="f-author">Autor contém</label>
          <input id="f-author" name="author" />

          <label for="f-genre">Gênero</label>
          <select id="f-genre" name="genre"></select>

          <label for="f-minPrice">Preço mínimo</label>
          <input id="f-minPrice" name="minPrice" type="number" step="0.01" min="0" />

          <label for="f-maxPrice">Preço máximo</label>
          <input id="f-maxPrice" name="maxPrice" type="number" step="0.01" min="0" />

          <label for="f-minStock">Estoque mínimo</label>
          <input id="f-minStock" name="minStock" type="number" min="0" />

          <label for="f-maxStock">Estoque máximo</label>
          <input id="f-maxStock" name="maxStock" type="number" min="0" />

          <div class="toolbar">
            <button type="submit">Aplicar filtros</button>
            <button type="button" id="clear-filters">Limpar</button>
          </div>
        </form>
      </fieldset>
    </div>

    <fieldset style="margin-top:24px">
      <legend>Livros</legend>
      <div id="list-notice" class="notice" style="display:none"></div>
      <table id="books-table">
        <thead>
          <tr>
            <th>Título</th>
            <th>Autor</th>
            <th>Gênero</th>
            <th>Preço</th>
            <th>Estoque</th>
            <th>Criado</th>
            <th>Atualizado</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </fieldset>

    <script>
      const allowedGenres = [
        'ficção','romance','mistério','fantasia','aventura','biografia','história','drama','terror','sci-fi','poesia','conto'
      ];

      const api = {
        async getBooks(params = {}) {
          const qs = new URLSearchParams();
          for (const [k,v] of Object.entries(params)) {
            if (v !== undefined && v !== null && String(v).trim() !== '') qs.append(k, v);
          }
          const url = '/api/books' + (qs.toString() ? ('?' + qs.toString()) : '');
          const r = await fetch(url);
          if (!r.ok) throw await r.json().catch(() => ({ message: r.statusText }));
          return r.json();
        },
        async createBook(payload) {
          const r = await fetch('/api/books', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
          if (!r.ok) throw await r.json().catch(() => ({ message: r.statusText }));
          return r.json();
        },
        async updateBook(id, payload) {
          const r = await fetch(`/api/books/${id}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
            redirect: 'follow'
          });
          if (!r.ok) {
            // Tenta ler corpo JSON de erro (400/404/409/500)
            throw await r.json().catch(() => ({ message: r.statusText }));
          }
          // Aceita tanto 200 (com JSON) quanto 204 (sem corpo)
          if (r.status === 204) return true;
          return r.json();
        },
        async deleteBook(id) {
          const r = await fetch(`/api/books/${id}`, { method: 'DELETE' });
          if (!r.ok) throw await r.json().catch(() => ({ message: r.statusText }));
          return true;
        }
      };

      function fillGenreSelect(selectEl, includeEmpty = false) {
        selectEl.innerHTML = '';
        if (includeEmpty) {
          const opt = document.createElement('option');
          opt.value = ''; opt.textContent = '(qualquer)';
          selectEl.appendChild(opt);
        }
        for (const g of allowedGenres) {
          const opt = document.createElement('option');
          opt.value = g; opt.textContent = g;
          selectEl.appendChild(opt);
        }
      }

      function fmtDate(d) { return new Date(d).toLocaleString(); }
      function money(v) { return Number(v).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }); }

      function showNotice(el, ok, msg) {
        el.style.display = 'block';
        el.className = 'notice ' + (ok ? 'ok' : 'err');
        el.textContent = msg;
        setTimeout(() => { el.style.display = 'none'; }, 3500);
      }

      function renderBooks(books) {
        const tbody = document.querySelector('#books-table tbody');
        tbody.innerHTML = '';
        for (const b of books) {
          const tr = document.createElement('tr');
          tr.dataset.id = b.id;
          tr.innerHTML = `
            <td>${b.title}</td>
            <td>${b.author}</td>
            <td>${b.genre}</td>
            <td>${money(b.price)}</td>
            <td>${b.stock}</td>
            <td>${fmtDate(b.createdAt)}</td>
            <td>${fmtDate(b.updatedAt)}</td>
            <td class="actions">
              <button data-action="edit">Editar</button>
              <button data-action="delete">Excluir</button>
            </td>
          `;
          tbody.appendChild(tr);
        }
      }

      async function refreshList(params = {}) {
        try {
          const books = await api.getBooks(params);
          renderBooks(books);
        } catch (err) {
          const msg = err?.message || 'Falha ao listar';
          showNotice(document.getElementById('list-notice'), false, msg);
        }
      }

      function attachRowActions() {
        const tbody = document.querySelector('#books-table tbody');
        tbody.addEventListener('click', async (ev) => {
          const btn = ev.target.closest('button');
          if (!btn) return;
          const tr = btn.closest('tr');
          const id = tr?.dataset.id;
          if (!id) return;
          const action = btn.dataset.action;

          if (action === 'delete') {
            if (!confirm('Excluir este livro?')) return;
            try { await api.deleteBook(id); await refreshList(currentFilters()); }
            catch (err) { showNotice(document.getElementById('list-notice'), false, err?.message || 'Erro ao excluir'); }
          }

          if (action === 'edit') {
            if (tr.classList.contains('row-edit')) { tr.classList.remove('row-edit'); tr.nextElementSibling?.remove?.(); return; }
            tr.classList.add('row-edit');
            const cells = tr.querySelectorAll('td');
            const title = cells[0].textContent;
            const author = cells[1].textContent;
            const genre = cells[2].textContent;
            const priceText = cells[3].textContent;
            const stock = cells[4].textContent;
            const price = String(priceText).replace(/[^0-9,.-]/g,'').replace('.', '').replace(',', '.');

            const editRow = document.createElement('tr');
            editRow.innerHTML = `
              <td colspan="8">
                <form class="edit-form">
                  <label>Título</label>
                  <input name="title" value="${title}" minlength="2" maxlength="120" required />
                  <label>Autor</label>
                  <input name="author" value="${author}" minlength="2" maxlength="120" required />
                  <label>Gênero</label>
                  <select name="genre"></select>
                  <label>Preço</label>
                  <input name="price" type="number" step="0.01" min="0" value="${price}" required />
                  <label>Estoque</label>
                  <input name="stock" type="number" min="0" value="${stock}" required />
                  <div class="toolbar">
                    <button type="submit">Salvar</button>
                    <button type="button" class="cancel-edit">Cancelar</button>
                  </div>
                </form>
              </td>`;
            tr.after(editRow);
            const genreSel = editRow.querySelector('select[name="genre"]');
            fillGenreSelect(genreSel);
            genreSel.value = genre;

            editRow.querySelector('.cancel-edit').addEventListener('click', () => { tr.classList.remove('row-edit'); editRow.remove(); });

            editRow.querySelector('.edit-form').addEventListener('submit', async (e) => {
              e.preventDefault();
              const fd = new FormData(e.target);
              const payload = Object.fromEntries(fd.entries());
              payload.price = Number(payload.price);
              payload.stock = Number(payload.stock);
              try {
                await api.updateBook(id, payload);
                showNotice(document.getElementById('list-notice'), true, 'Atualizado com sucesso');
                tr.classList.remove('row-edit');
                editRow.remove();
                await refreshList(currentFilters());
              } catch (err) {
                showNotice(document.getElementById('list-notice'), false, err?.message || 'Erro ao atualizar');
              }
            });
          }
        });
      }

      function currentFilters() {
        const f = document.getElementById('filter-form');
        const fd = new FormData(f);
        const params = Object.fromEntries(fd.entries());
        // Normaliza números: aceita vírgula e converte para ponto
        const normalizeDecimal = (v) => {
          if (v === undefined || v === null) return undefined;
          const s = String(v).trim();
          if (s === '') return undefined;
          const n = Number(s.replace(',', '.'));
          if (Number.isNaN(n)) return undefined;
          return String(n);
        };
        const normalizeInt = (v) => {
          if (v === undefined || v === null) return undefined;
          const s = String(v).trim();
          if (s === '') return undefined;
          const n = parseInt(s.replace(',', '.'), 10);
          if (Number.isNaN(n)) return undefined;
          return String(n);
        };
        params.minPrice = normalizeDecimal(params.minPrice);
        params.maxPrice = normalizeDecimal(params.maxPrice);
        params.minStock = normalizeInt(params.minStock);
        params.maxStock = normalizeInt(params.maxStock);
        return params;
      }

      function init() {
        // Gêneros
        fillGenreSelect(document.getElementById('c-genre'));
        fillGenreSelect(document.getElementById('f-genre'), true);

        // Listeners
        document.getElementById('create-form').addEventListener('submit', async (e) => {
          e.preventDefault();
          const fd = new FormData(e.target);
          const payload = Object.fromEntries(fd.entries());
          payload.price = Number(payload.price);
          payload.stock = Number(payload.stock);
          try {
            const created = await api.createBook(payload);
            showNotice(document.getElementById('create-notice'), true, `Criado: ${created.title}`);
            e.target.reset();
            await refreshList(currentFilters());
          } catch (err) {
            const msg = err?.title || err?.message || 'Erro ao criar';
            showNotice(document.getElementById('create-notice'), false, msg);
          }
        });

        document.getElementById('filter-form').addEventListener('submit', async (e) => {
          e.preventDefault();
          const params = currentFilters();
          // Validações simples: min <= max
          const mp = params.minPrice !== undefined ? Number(params.minPrice) : undefined;
          const xp = params.maxPrice !== undefined ? Number(params.maxPrice) : undefined;
          const ms = params.minStock !== undefined ? Number(params.minStock) : undefined;
          const xs = params.maxStock !== undefined ? Number(params.maxStock) : undefined;
          if (mp !== undefined && xp !== undefined && mp > xp) {
            showNotice(document.getElementById('list-notice'), false, 'Preço mínimo não pode ser maior que o máximo.');
            return;
          }
          if (ms !== undefined && xs !== undefined && ms > xs) {
            showNotice(document.getElementById('list-notice'), false, 'Estoque mínimo não pode ser maior que o máximo.');
            return;
          }
          await refreshList(params);
        });

        document.getElementById('clear-filters').addEventListener('click', async () => {
          document.getElementById('filter-form').reset();
          await refreshList();
        });

        attachRowActions();
        refreshList();
      }

      init();
    </script>
  </body>
</html>
